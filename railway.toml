[build]
builder = "DOCKERFILE"
dockerfilePath = "tools/brief_app/Dockerfile"

[deploy]
startCommand = "streamlit run tools/brief_app/app.py --server.headless=true --server.port=${PORT:-8501} --server.address=0.0.0.0 --browser.gatherUsageStats=false"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
healthcheckPath = "/healthz"
healthcheckTimeout = 30

# A persistent Railway Volume must be mounted at /data so customer configs and
# generated briefs survive deploys. Create it in the Railway dashboard:
#   Service → Settings → Volumes → New Volume → mount path: /data
#
# Required env vars (set in Railway dashboard → Variables):
#   BRIEF_APP_DATA=/data
#   UNSPLASH_ACCESS_KEY=<your Unsplash key>   # optional but recommended

# Render.com blueprint — near one-click. In Render: New → Blueprint → point at this repo.
# It reads this file, builds the Docker image, mounts the /data volume. You then paste
# the two secret env vars (ANTHROPIC_API_KEY, APP_PASSWORD) when prompted.
services:
  - type: web
    name: equalice-plans
    runtime: docker
    dockerfilePath: ./tools/brief_app/Dockerfile
    dockerContext: .
    plan: starter          # smallest paid tier; free tier has no persistent disk
    envVars:
      - key: BRIEF_APP_DATA
        value: /data
      - key: ANTHROPIC_API_KEY
        sync: false          # you paste this in the dashboard (kept secret)
      - key: APP_PASSWORD
        sync: false          # team password to gate the URL
    disk:
      name: data
      mountPath: /data       # brands + generated plans survive redeploys
      sizeGB: 1
